name: Firmware quality gates

on:
  push:
    branches:
      - main
      - "cleanup/**"
      - "feat/**"
    paths:
      - "firmware/**"
      - "tests/host/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tests/host/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

jobs:
  host-tests:
    name: Host safety tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build host tests
        run: cmake --build build/host --parallel
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure

  esp32-build:
    name: ESP32 firmware compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio==6.1.18
      - name: Compile ESP32 firmware
        run: pio run --project-dir firmware/esp32 --environment esp32dev
